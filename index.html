const TAU=Math.PI*2;

function tail(p,w=26,stripes=[.3,.5,.7]){

 const blush=pat?'<g transform="translate('+(200+tr)+' '+hy.toFixed(1)+')"><ellipse cx="-84" cy="36" rx="24" ry="15" fill="#F4748F" opacity=".75"/><ellipse cx="84" cy="36" rx="24" ry="15" fill="#F4748F" opacity=".75"/></g>':'';
 let hearts='';
 if(pat){for(let i=0;i<4;i++){const k=((t-PS)*.7+i*.25)%1;hearts+='<path transform="translate('+(150+i*38+8*Math.sin(k*6+i))+' '+(90-k*90)+') scale('+(.7+k*.3)+')" d="M0 6 c-10 -12 -22 2 0 18 c22 -16 10 -30 0 -18z" fill="#F4748F" opacity="'+(1-k).toFixed(2)+'"/>';}}
 const prr=pat?'<text x="300" y="'+(130+2*Math.sin(t*30))+'" font-family="Arial" font-weight="700" font-size="24" fill="#C0708A">prrr~</text>':'';
 const fy=tapY;
 const finger=(!NOFINGER&&pat&&fy>-29)?'<g transform="translate(206 '+fy.toFixed(1)+')"><rect x="-17" y="-90" width="34" height="96" rx="17" fill="#F6D3B3" stroke="#4A3A36" stroke-width="4"/></g>':'';
 return s+(bl&&!pat?extra:hd)+blush+rip+hearts+prr+finger+'</g>';}
function sleep(t){const b=1+.015*Math.sin(TAU*.35*t);return `<g transform="translate(0 ${(60*(1-b)).toFixed(1)}) scale(1 ${b.toFixed(3)})">${poses.sleeping.replace(/<text[\s\S]*$/,'')}</g>`;}

const bg=`<defs><linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="390"><stop offset="0" stop-color="#BDB8B4"/><stop offset=".6" stop-color="#A8A39F"/><stop offset="1" stop-color="#8F8A86"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE3F7"/><stop offset="1" stop-color="#E6F5FC"/></linearGradient></defs>
<rect width="400" height="540" fill="#FDEBD3"/><rect width="400" height="390" fill="#FBE3C5"/>
<rect x="110" y="60" width="180" height="150" rx="10" fill="#fff" stroke="#B98A5E" stroke-width="8"/><rect x="118" y="68" width="164" height="134" rx="4" fill="url(#sky)"/><path d="M200 68 V202 M118 135 H282" stroke="#B98A5E" stroke-width="6"/>
<ellipse cx="160" cy="110" rx="26" ry="10" fill="#fff"/><ellipse cx="180" cy="104" rx="18" ry="10" fill="#fff"/>
<rect y="390" width="400" height="150" fill="#E2B27B"/><rect y="390" width="400" height="6" fill="#C98F55"/><path d="M0 430 H400 M0 470 H400 M0 510 H400" stroke="#D49F66" stroke-width="3"/>
<ellipse cx="200" cy="470" rx="170" ry="38" fill="#F4B6C2" opacity=".75"/>
<circle cx="345" cy="440" r="22" fill="#E8607A" stroke="#4A3A36" stroke-width="4"/><path d="M328 432 Q345 446 362 432 M326 446 Q345 458 364 444" stroke="#4A3A36" stroke-width="3" fill="none"/>`;
// ===== app =====
let PS=-99,PE=-99,EX0=-99,EX1=-99,NOFINGER=true;
const stage=document.getElementById('stage');
const saved=JSON.parse(localStorage.getItem('taro')||'null');
const st=Object.assign({hunger:75,fun:70,energy:85,love:70,saved:Date.now()},saved||{});
{const dt=Math.min(6*3600,(Date.now()-st.saved)/1000);st.hunger=Math.max(20,st.hunger-dt*.004);st.fun=Math.max(20,st.fun-dt*.003);st.energy=Math.max(25,st.energy-dt*.002);st.love=Math.max(25,st.love-dt*.002);}
let now=0;
const cat={c:150,dir:1,mode:'sit',ph:0,until:2,target:null,after:null,spd:'walk'};
const ball={x:345,y:458,drag:false,fresh:false,vx:0};
const EAT_C=110, SLEEP_C=290;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function goto(c,after,spd='walk'){cat.target=clamp(c,80,320);cat.after=after;cat.mode='walk';cat.spd=spd;}
function wake(){if(cat.mode==='sleep'||cat.mode==='eat')cat.mode='sit';}
function feed(){if(cat.mode==='pet')return;goto(EAT_C,'eat','brisk');}
function nap(){if(cat.mode==='pet')return;goto(SLEEP_C,'sleep','brisk');}
function pat(){PS=now;PE=now+2.4;cat.mode='pet';cat.until=PE;st.love=clamp(st.love+14,0,100);st.fun=clamp(st.fun+4,0,100);}
function resetBall(){ball.x=345;ball.y=458;ball.fresh=false;}
function update(dt){
 const sl=cat.mode==='sleep',ea=cat.mode==='eat';
 st.hunger=clamp(st.hunger-(sl?.07:.17)*dt+(ea?14*dt:0),0,100);
 st.fun=clamp(st.fun-.13*dt+(cat.mode==='play'?9*dt:0),0,100);
 st.energy=clamp(st.energy+(sl?3.2:-.07)*dt,0,100);
 st.love=clamp(st.love-.05*dt,0,100);
 // ball roll
 if(!ball.drag){ball.x=clamp(ball.x+ball.vx*dt,25,375);ball.vx*=Math.pow(.05,dt);}
 // chase interrupt
 if(ball.fresh&&cat.mode!=='pet'&&cat.mode!=='chase'&&cat.mode!=='play'){cat.mode='chase';}
 const speeds={walk:[74,1.6,24],brisk:[97,2.1,24],run:[174,3.0,30]};
 switch(cat.mode){
  case 'pet': if(now>cat.until){cat.mode='sit';cat.until=now+2;} break;
  case 'sleep': if(st.energy>=98||now>cat.until){cat.mode='sit';cat.until=now+1.5;} break;
  case 'eat': if(st.hunger>=99||now>cat.until){cat.mode='sit';cat.until=now+1.5;} break;
  case 'play': if(now>cat.until){cat.mode='sit';cat.until=now+2;} break;
  case 'sit': if(now>cat.until){
     if(st.hunger<35&&Math.random()<.7)feed();
     else if(st.energy<28)nap();
     else if(Math.random()<.55)goto(90+Math.random()*220,null,'walk');
     else cat.until=now+2+Math.random()*3;} break;
  case 'walk': case 'chase': {
     let tgt=cat.target, sp=speeds[cat.spd];
     if(cat.mode==='chase'){const d0=ball.x>cat.c?1:-1;tgt=clamp(ball.x-d0*100,80,320);sp=speeds.run;if(Math.abs(ball.x-cat.c)<110){tgt=cat.c;}}
     const d=tgt-cat.c;
     if(cat.mode==='chase'&&Math.abs(ball.x-cat.c)<=112){cat.dir=ball.x>cat.c?1:-1;cat.mode='play';cat.until=now+3.5;ball.fresh=false;break;}
     if(Math.abs(d)<=Math.max(2,sp[0]*dt)){cat.c=tgt;
        if(cat.mode==='walk'){ if(cat.after==='eat'){cat.mode='eat';cat.dir=1;cat.until=now+9;}
          else if(cat.after==='sleep'){cat.mode='sleep';cat.dir=1;cat.until=now+30;}
          else {cat.mode='sit';cat.until=now+2+Math.random()*2;} }
        else if(Math.abs(ball.x-cat.c)>112){/* keep chasing */}
        break;}
     cat.dir=d>0?1:-1;cat.c+=cat.dir*sp[0]*dt;cat.ph+=dt*sp[1];
     break;}
 }
}
function place(inner,c,center,flip){
 const xt=c-center*.58;let g=`<g transform="translate(${xt.toFixed(1)} 218) scale(.58)">${inner}</g>`;
 if(flip)g=`<g transform="translate(${(2*c).toFixed(1)} 0) scale(-1 1)">${g}</g>`;
 return g;}
function bird(t){const x=130+((t*18)%130),y=90+6*Math.sin(t*4),f=Math.sin(t*14)*6;return `<g transform="translate(${x} ${y})"><path d="M-8 0 Q-4 ${-8+f} 0 0 Q4 ${-8+f} 8 0" fill="none" stroke="#4A3A36" stroke-width="3" stroke-linecap="round"/></g>`;}
function ballSvg(x,y){return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="22" fill="#E8607A" stroke="#4A3A36" stroke-width="4"/><path d="M-17 -8 Q0 6 17 -8 M-19 6 Q0 18 19 4 M-6 -20 Q4 0 -6 20" stroke="#4A3A36" stroke-width="3" fill="none"/></g>`;}
const bgStatic=bg.replace(/<circle cx="345"[\s\S]*$/,'');
function render(){
 let c=`<ellipse cx="${cat.c}" cy="452" rx="78" ry="9" fill="#00000018"/>`;
 const m=cat.mode,t=now;
 const flip=cat.dir<0;
 if(m==='walk'||m==='chase'){
  const run=m==='chase';const o=run?{ph:cat.ph,S:30,bk:3.4,lean:5,head:-3,tailA:1.8,tailF:2.2}:{ph:cat.ph,S:cat.spd==='brisk'?24:24,bk:1};
  let inner=walk(t,o);
  if(run){const hop=-16*Math.abs(Math.sin(Math.PI*cat.ph));const s2=1+.05*Math.sin(TAU*cat.ph);inner=`<g transform="translate(0 ${hop.toFixed(1)}) translate(170 360) scale(${s2.toFixed(3)} ${(2-s2).toFixed(3)}) translate(-170 -360)">${inner}</g>`;}
  c+=place(inner,cat.c,170,flip);
 } else if(m==='play'){
  c+=place(walk(t,{ph:.2,still:true,head:7,lean:2,tailA:2.4,tailF:2.6}),cat.c,170,flip);
 } else if(m==='eat'){ c+=place(eat(t),cat.c,200,false);
 } else if(m==='sleep'){ c+=place(sleep(t),cat.c,200,false);
   const k=(t*.8)%1;c+=`<g fill="#8E7CC3" font-family="Arial" font-weight="700" opacity="${(1-k).toFixed(2)}"><text x="${cat.c+40+k*30}" y="${400-k*60}" font-size="${20+k*10}">z</text></g>`;
 } else { // sit / pet
  c+=place(sit(t),cat.c,200,flip);
 }
 let by=ball.y; if(m==='play')by=ball.y-Math.abs(Math.sin((cat.until-now)*7))*34;
 stage.innerHTML=bgStatic+bird(t)+c+ballSvg(ball.x,by);
}
let last=performance.now(),acc=0,barT=0;
function tick(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;now+=dt;update(dt);acc+=dt;if(acc>=1/30){acc=0;render();}
 barT+=dt;if(barT>.4){barT=0;for(const k of ['hunger','fun','energy','love'])document.getElementById('b_'+k).style.width=st[k]+'%';}
 requestAnimationFrame(tick);}
setInterval(()=>{st.saved=Date.now();localStorage.setItem('taro',JSON.stringify(st));},4000);
function pt(e){const r=stage.getBoundingClientRect();return [(e.clientX-r.left)/r.width*400,(e.clientY-r.top)/r.height*540];}
stage.addEventListener('pointerdown',e=>{const [x,y]=pt(e);
 if(Math.hypot(x-ball.x,y-ball.y)<42){ball.drag=true;ball.fresh=true;wake();stage.setPointerCapture(e.pointerId);return;}
 if(Math.abs(x-cat.c)<85&&y>300&&y<470){wake();pat();}
});
stage.addEventListener('pointermove',e=>{if(!ball.drag)return;const [x,y]=pt(e);ball.vx=(x-ball.x)*8;ball.x=clamp(x,25,375);ball.y=clamp(y,425,505);ball.fresh=true;});
stage.addEventListener('pointerup',()=>{ball.drag=false;});
document.getElementById('feed').onclick=()=>{wake();feed();};
document.getElementById('nap').onclick=()=>{nap();};
document.getElementById('yarn').onclick=()=>{resetBall();ball.fresh=true;wake();};
requestAnimationFrame(tick);

</script></body></html>
